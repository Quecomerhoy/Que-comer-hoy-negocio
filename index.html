<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qué Comer Negocio</title>
<meta name="robots" content="noindex">
<script>
(async()=>{
  const destino='https://quecomerhoy.github.io/central-que-comer/que-comer-principal-negocio.html';
  try{
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).catch(()=>null);
      if(reg)await reg.update().catch(()=>{});
    }
    if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}
  }catch(e){}
  location.replace(destino+(location.search||'')+(location.hash||''));
})();
</script>
</head>
<body style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px">Actualizando y abriendo Qué Comer Negocio…</body>
</html>
